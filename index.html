    <script type="text/babel">
        // =========================================================================
        // SECTION 1: 전역 설정 및 Firebase 클라우드 실시간 동기화 초기화
        // =========================================================================
        const { useState, useEffect, useRef, useMemo } = React;

        // Firebase 설정 수집 및 앱 식별자 정의
        const appId = window.__app_id || 'dice-math-lab-v1';
        const firebaseConfig = window.__firebase_config 
          ? (typeof window.__firebase_config === 'string' ? JSON.parse(window.__firebase_config) : window.__firebase_config)
          : { 
              apiKey: "AIzaSyDemoConfigForTestingWithoutKey", 
              authDomain: "demo-app.firebaseapp.com", 
              projectId: "demo-app", 
              storageBucket: "demo-app.appspot.com", 
              messagingSenderId: "123456789", 
              appId: "1:123456789:web:abcdef" 
            };

        let db = null;
        let auth = null;

        // Firebase Firestore 실시간 데이터베이스 안전 초기화
        if (window.firebase) {
          try {
            if (!firebase.apps.length) {
              firebase.initializeApp(firebaseConfig);
            }
            auth = firebase.auth();
            db = firebase.firestore();
            auth.signInAnonymously().catch((err) => console.log("Firebase Auth optional fallback active"));
          } catch(e) {
            console.warn("Firebase Init Fallback:", e);

        }

        // 오프라인/동일 기기 다른 탭간 실시간 보완 동기화 채널
        const localSyncChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('dice_math_lab_local_sync') : null;


        // =========================================================================
        // SECTION 2: 차트 컴포넌트 (Recharts 연동 및 SVG Fallback 차트)
        // [요구사항 2] 점선(ReferenceLine)이 막대 그래프 레이어 위에 오도록 Bar 뒤로 배치
        // =========================================================================
        const SafeChart = ({ data, height = 250, barColor = "#6366f1", targetVal = 0.167 }) => {
          if (window.Recharts && window.Recharts.BarChart) {
            const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine, Cell } = window.Recharts;
            return (
              <ResponsiveContainer width="100%" height={height}>
                <BarChart data={data}>
                  <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                  <XAxis dataKey="face" tick={{ fontSize: 12, fill: '#64748b' }} />
                  <YAxis domain={[0, 0.40]} tick={{ fontSize: 12, fill: '#64748b' }} />
                  <Tooltip formatter={(value, name) => [value, name === 'relativeFreq' ? '상대도수' : '이론적 확률']} />
                  <Bar dataKey="relativeFreq" name="relativeFreq" fill={barColor} radius={[6, 6, 0, 0]}>
                    {data.map((entry, index) => (
                      <Cell key={`cell-${index}`} fill={entry.relativeFreq === 0 ? '#cbd5e1' : barColor} />
                    ))}
                  </Bar>
                  {/* ReferenceLine을 Bar 뒤로 이동시켜 막대 그래프 레이어 위에 점선이 오도록 설정 */}
                  <ReferenceLine y={targetVal} stroke="#ef4444" strokeDasharray="4 4" strokeWidth={2} label={{ value: `1/6 (${targetVal})`, fill: '#ef4444', fontSize: 11, position: 'top' }} />
                </BarChart>
              </ResponsiveContainer>
            );
          }

          // Recharts 차트 스크립트 미로드/차단 시 순수 SVG Fallback 차트 렌더링
          const maxVal = 0.40;
          return (
            <div className="w-full flex flex-col justify-end items-center relative pt-6 bg-slate-50/50 rounded-xl p-4 border border-slate-100" style={{ height }}>

                className="absolute w-full border-b-2 border-dashed border-rose-500 left-0 flex justify-end px-2 z-20 pointer-events-none"
                style={{ bottom: `${(targetVal / maxVal) * 80 + 15}%` }}
              >
                <span className="text-[10px] font-bold text-rose-500 bg-white px-1 -mt-3 rounded border border-rose-200">1/6 (0.167)</span>
              </div>
              
              <div className="w-full h-full flex items-end justify-around gap-2 pt-4 border-b border-slate-300 z-10">
                {data.map((item, idx) => {
                  const heightPct = Math.min(100, Math.max(2, (item.relativeFreq / maxVal) * 100));
                  return (
                    <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end group relative">
                      <span className="text-[10px] font-mono font-bold text-slate-600 mb-1 opacity-0 group-hover:opacity-100 transition-opacity bg-slate-800 text-white px-1.5 py-0.5 rounded absolute -top-5">
                        {item.relativeFreq}
                      </span>
                      <div 
                        className="w-full max-w-[40px] rounded-t-lg transition-all duration-300"
                        style={{ 
                          height: `${heightPct}%`, 
                          backgroundColor: item.relativeFreq === 0 ? '#cbd5e1' : barColor 
                        }}
                      />
                      <span className="text-xs font-bold text-slate-600 mt-2">{item.num}의 눈</span>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        };


        // =========================================================================
        // SECTION 3: SVG 아이콘 컴포넌트 모음
        // =========================================================================
        const IconBase = ({ children, className = "w-4 h-4", ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>

        const IconDices = (p) => <IconBase {...p}><rect width="12" height="12" x="2" y="10" rx="2" /><path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3.15l-4.27-4.27a2.24 2.24 0 0 0-3.15 0L10.5 6.58" /><circle cx="6" cy="14" r="1" /><circle cx="10" cy="18" r="1" /><circle cx="15" cy="9" r="1" /></IconBase>;

        const IconHelpCircle = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><line x1="12" y1="17" x2="12.01" y2="17" /></IconBase>;
        const IconSparkles = (p) => <IconBase {...p}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3z" /></IconBase>;
        const IconBarChart3 = (p) => <IconBase {...p}><path d="M3 3v18h18" /><path d="M18 17V9" /><path d="M13 17V5" /><path d="M8 17v-3" /></IconBase>;
        const IconSettings = (p) => <IconBase {...p}><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" /></IconBase>;
        const IconShieldAlert = (p) => <IconBase {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></IconBase>;
        const IconLayers = (p) => <IconBase {...p}><polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" /></IconBase>;
        const IconChevronRight = (p) => <IconBase {...p}><polyline points="9 18 15 12 9 6" /></IconBase>;
        const IconUserCheck = (p) => <IconBase {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><polyline points="16 11 18 13 22 9" /></IconBase>;
        const IconLogOut = (p) => <IconBase {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></IconBase>;
        const IconLock = (p) => <IconBase {...p}><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></IconBase>;
        const IconRefreshCw = (p) => <IconBase {...p}><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" /><path d="M16 21h5v-5" /></IconBase>;
        const IconArrowUpDown = (p) => <IconBase {...p}><path d="m21 16-4 4-4-4" /><path d="M17 20V4" /><path d="m3 8 4-4 4 4" /><path d="M7 4v16" /></IconBase>;
        const IconArrowUp = (p) => <IconBase {...p}><line x1="12" y1="19" x2="12" y2="5" /><polyline points="5 12 12 5 19 12" /></IconBase>;
        const IconArrowDown = (p) => <IconBase {...p}><line x1="12" y1="5" x2="12" y2="19" /><polyline points="19 12 12 19 5 12" /></IconBase>;


        // =========================================================================
        // SECTION 4: Audio API 기반 주사위 효과음 합성
        // =========================================================================
        let sharedAudioCtx = null;

        const getAudioContext = () => {
          if (!sharedAudioCtx) {
            const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
            if (AudioCtxClass) {
              sharedAudioCtx = new AudioCtxClass();
            }
          }
          if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
            sharedAudioCtx.resume().catch(() => {});
          }
          return sharedAudioCtx;
        };

        if (typeof window !== 'undefined') {
          const unlockAudio = () => {
            const ctx = getAudioContext();
            if (ctx && ctx.state === 'suspended') {
              ctx.resume().then(() => {
                window.removeEventListener('click', unlockAudio);
                window.removeEventListener('touchstart', unlockAudio);
              });
            }
          };
          window.addEventListener('click', unlockAudio);
          window.addEventListener('touchstart', unlockAudio);
        }

        const playDiceRollSound = (isFast = false) => {
          try {
            const ctx = getAudioContext();
            if (!ctx) return;

            const hits = isFast ? 2 : 4;
            for (let i = 0; i < hits; i++) {
              const delay = isFast ? i * 0.04 : i * 0.07 + Math.random() * 0.02;
              const startTime = ctx.currentTime + delay;

              const glassOsc = ctx.createOscillator();
              const glassGain = ctx.createGain();
              const baseFreq = 1200 + Math.random() * 600;
              const duration = isFast ? 0.05 : 0.09;

              glassOsc.type = 'sine';
              glassOsc.frequency.setValueAtTime(baseFreq, startTime);
              glassOsc.frequency.exponentialRampToValueAtTime(baseFreq * 0.85, startTime + duration);

              glassGain.gain.setValueAtTime(isFast ? 0.12 : 0.18, startTime);
              glassGain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

              glassOsc.connect(glassGain);
              glassGain.connect(ctx.destination);
              glassOsc.start(startTime);
              glassOsc.stop(startTime + duration);
            }
          } catch (e) {}
        };


        // =========================================================================
        // SECTION 5: 3D 주사위 그래픽 컴포넌트 (DiceFace & Dice3D)
        // [요구사항 3] 주사위 가장자리 모서리 튀어나옴(어색한 귀퉁이) 깔끔하게 보완
        // =========================================================================
        function DiceFace({ number }) {
          const getDots = () => {
            switch (number) {
              case 1: return <div className="col-start-2 row-start-2 w-5 h-5 bg-indigo-900 rounded-full justify-self-center self-center shadow-inner" />;
              case 2: return (<><div className="col-start-1 row-start-1 w-4 h-4 bg-indigo-800 rounded-full justify-self-center self-center" /><div className="col-start-3 row-start-3 w-4 h-4 bg-indigo-800 rounded-full justify-self-center self-center" /></>);
              case 3: return (<><div className="col-start-1 row-start-1 w-4 h-4 bg-indigo-800 rounded-full justify-self-center self-center" /><div className="col-start-2 row-start-2 w-4 h-4 bg-indigo-800 rounded-full justify-self-center self-center" /><div className="col-start-3 row-start-3 w-4 h-4 bg-indigo-800 rounded-full justify-self-center self-center" /></>);
              case 4: return (<><div className="col-start-1 row-start-1 w-4 h-4 bg-indigo-800 rounded-full justify-self-center self-center" /><div className="col-start-3 row-start-1 w-4 h-4 bg-indigo-800 rounded-full justify-self-center self-center" /><div className="col-start-1 row-start-3 w-4 h-4 bg-indigo-800 rounded-full justify-self-center self-center" /><div className="col-start-3 row-start-3 w-4 h-4 bg-indigo-800 rounded-full justify-self-center self-center" /></>);
              case 5: return (<><div className="col-start-1 row-start-1 w-4 h-4 bg-indigo-800 rounded-full justify-self-center self-center" /><div className="col-start-3 row-start-1 w-4 h-4 bg-indigo-800 rounded-full justify-self-center self-center" /><div className="col-start-2 row-start-2 w-4 h-4 bg-indigo-800 rounded-full justify-self-center self-center" /><div className="col-start-1 row-start-3 w-4 h-4 bg-indigo-800 rounded-full justify-self-center self-center" /><div className="col-start-3 row-start-3 w-4 h-4 bg-indigo-800 rounded-full justify-self-center self-center" /></>);
              case 6: return (<><div className="col-start-1 row-start-1 w-4 h-4 bg-indigo-800 rounded-full justify-self-center self-center" /><div className="col-start-3 row-start-1 w-4 h-4 bg-indigo-800 rounded-full justify-self-center self-center" /><div className="col-start-1 row-start-2 w-4 h-4 bg-indigo-800 rounded-full justify-self-center self-center" /><div className="col-start-3 row-start-2 w-4 h-4 bg-indigo-800 rounded-full justify-self-center self-center" /><div className="col-start-1 row-start-3 w-4 h-4 bg-indigo-800 rounded-full justify-self-center self-center" /><div className="col-start-3 row-start-3 w-4 h-4 bg-indigo-800 rounded-full justify-self-center self-center" /></>);
              default: return null;
            }
          };
          return <div className="w-full h-full p-2.5 bg-gradient-to-br from-white to-indigo-50 border-2 border-indigo-200 rounded-2xl grid grid-cols-3 grid-rows-3 shadow-md box-border">{getDots()}</div>;
        }

        function Dice3D({ rotation, transitionSpeed }) {
  const durationClass = transitionSpeed === 'fast' ? 'duration-200' : 'duration-500';
  const faceStyle = { backfaceVisibility: 'hidden' };

  return (
    <div className="w-32 h-32 my-6 perspective-800 flex items-center justify-center">
      <div className={`w-24 h-24 relative transform-style-3d transition-transform ${durationClass} ease-out`} style={{ transform: `rotateX(${rotation.x}deg) rotateY(${rotation.y}deg)` }}>
        <div className="absolute w-24 h-24 translate-z-12" style={faceStyle}><DiceFace number={1} /></div>
        <div className="absolute w-24 h-24 rotate-y-180 translate-z-12" style={faceStyle}><DiceFace number={6} /></div>
        <div className="absolute w-24 h-24 rotate-y-90 translate-z-12" style={faceStyle}><DiceFace number={2} /></div>
        <div className="absolute w-24 h-24 -rotate-y-90 translate-z-12" style={faceStyle}><DiceFace number={5} /></div>
        <div className="absolute w-24 h-24 rotate-x-90 translate-z-12" style={faceStyle}><DiceFace number={3} /></div>
        <div className="absolute w-24 h-24 -rotate-x-90 translate-z-12" style={faceStyle}><DiceFace number={4} /></div>
      </div>
    </div>
  );
}

        const getNextRotation = (currentRot, targetValue, isFast) => {
          const baseAngles = { 1: { x: 0, y: 0 }, 2: { x: 0, y: -90 }, 3: { x: -90, y: 0 }, 4: { x: 90, y: 0 }, 5: { x: 0, y: 90 }, 6: { x: 0, y: 180 } };
          const target = baseAngles[targetValue] || { x: 0, y: 0 };
          const extraTurns = isFast ? 360 : 720;
          const getNextAngle = (current, targetBase) => {
            const currentMod = current % 360;
            let diff = (targetBase - currentMod) % 360;
            if (diff < 0) diff += 360;
            return current + extraTurns + diff;
          };
          return { x: getNextAngle(currentRot.x, target.x), y: getNextAngle(currentRot.y, target.y) };
        };


        // =========================================================================
        // SECTION 6: 메인 애플리케이션 컴포넌트 (App)
        // =========================================================================
        function App() {
            const broadcastData = (topic, payload) => {
  try {
    if (mqttClientRef.current && mqttClientRef.current.connected) {
      mqttClientRef.current.publish(topic, JSON.stringify(payload), { retain: true, qos: 0 });
    }
  } catch(err) {}
};
          // --- 6.1: 화면 상태 및 로그인 관리 ---
          const [viewMode, setViewMode] = useState('login');
          const [loginType, setLoginType] = useState('student');
          const [teacherPass, setTeacherPass] = useState('');
          const [teacherAuthError, setTeacherAuthError] = useState(false);

          const [inputClass, setInputClass] = useState('');
          const [inputNumber, setInputNumber] = useState('');
          const [inputName, setInputName] = useState('');
          const [currentStudentId, setCurrentStudentId] = useState(null);

          // --- 6.2: 네트워크 동기화 상태 감지 [요구사항 1] ---
          const [isConnected, setIsConnected] = useState(typeof window !== 'undefined' ? window.navigator.onLine : true);

          useEffect(() => {
            const handleOnline = () => setIsConnected(true);
            const handleOffline = () => setIsConnected(false);

            window.addEventListener('online', handleOnline);
            window.addEventListener('offline', handleOffline);

            return () => {
              window.removeEventListener('online', handleOnline);
              window.removeEventListener('offline', handleOffline);
            };
          }, []);

          // --- 6.3: 주사위 모션 및 상태 ---
          const [diceRotation, setDiceRotation] = useState({ x: 0, y: 0 });
          const [currentDiceValue, setCurrentDiceValue] = useState(1);
          const [isRolling, setIsRolling] = useState(false);
          const [transitionSpeed, setTransitionSpeed] = useState('normal');

          // --- 6.4: 학급/모둠 실시간 공유 상태 ---
          const [students, setStudents] = useState([]);
          const [groupCount, setGroupCount] = useState(3);
          const [selectedTeacherTab, setSelectedTeacherTab] = useState('overview');
          const [activeGroupFilter, setActiveGroupFilter] = useState(1);
          const [isActivityPaused, setIsActivityPaused] = useState(false);

          // --- 6.5: 데이터 정렬 상태 ---

            const idx = prev.findIndex(s => s.id === payload.id);

              const updated = [...prev];

              return updated;
            }
            return [...prev, payload];

    client.on('error', () => setIsConnected(false));

                                  <li>개인 실험(10~100회) 결과와 학급 전체({classData.total}회) 결과에서 나타나는 상대도수 그래프 모양의 차이점은 무엇인가요?</li>
                                  <li>주사위를 무한히 많이 던진다면 각 눈이 나올 상대도수는 어떤 소수 값에 점점 가까워질까요?</li>
                                </ul>
                              </div>
                            </div>
                          );
                        })()}
                      </div>
                    )}
                  </div>
                )}
              </main>
            </div>
          );
        }

        // React 앱 루트 렌더링
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
